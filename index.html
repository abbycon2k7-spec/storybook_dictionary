<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Word by Word, Step by Step: A Storybook Dictionary (K–O)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Book trim size: 6 in x 9 in per page (576 x 864 px at 96 dpi) */
@page{size:6in 9in;margin:0}
:root{--stage:#D9B07A;--stage2:#B98B50;--ink:#34404A;--paper:#FFFDF4;--or:#F58F2B;--ortxt:#B85600;--teal:#187A6F;--tealbright:#2FB3A3;--pink:#F27C93;--pinktxt:#B8405A;--yel:#FFD25A;--chrome:#fff;--chromeink:#17695F;--board:#2F6B5A;--wood:#B98B50;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--stage:#4a3522;--stage2:#2d2014;--chrome:#22343d;--chromeink:#8fe3d6}}
:root[data-theme=dark]{--stage:#4a3522;--stage2:#2d2014;--chrome:#22343d;--chromeink:#8fe3d6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:linear-gradient(var(--stage),var(--stage2));font-family:Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;display:flex;flex-direction:column;align-items:center}
#stage{flex:1;width:100%;position:relative;overflow:hidden}
#scaler{position:absolute;left:50%;top:50%;width:1152px;height:864px;transform-origin:center}
#book{position:absolute;inset:0;perspective:3000px;transition:transform .8s ease}
.leaf{position:absolute;left:576px;top:0;width:576px;height:864px;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.5,.1,.3,1)}
.leaf.f{transform:rotateY(-180deg)}
/* notebook-paper pages */
.side{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(70,150,210,.16) 31px 32px);background-position:0 44px;padding:44px 48px;color:#34404A;font-size:16px}
.side::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:rgba(220,80,110,.45);pointer-events:none}
.side::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:16px;background:radial-gradient(circle at 8px 50%,#8f6b3f 0 5px,transparent 6px) 0 0/16px 288px repeat-y;pointer-events:none}
.side.bk::before{left:auto;right:34px}.side.bk::after{left:auto;right:8px}
.side.cv::before,.side.cv::after,.side.empty::before,.side.empty::after{display:none}
.side.fr{border-radius:0 14px 14px 0;box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.28),4px 6px 14px rgba(0,0,0,.18)}
.side.bk{transform:rotateY(180deg);border-radius:14px 0 0 14px;box-shadow:inset -14px 0 18px -10px rgba(0,0,0,.28),-4px 6px 14px rgba(0,0,0,.18)}
.side.empty{background:transparent;box-shadow:none}
.zone{position:absolute;top:0;width:32px;height:864px;z-index:999;cursor:pointer}
h1,h2,h3{font-family:Fredoka,sans-serif;margin:0;color:var(--ortxt)}
/* chalkboard headings */
h2{font:600 36px Fredoka,sans-serif;text-align:center;margin:0 0 16px;color:#fff;background:var(--board);border:5px solid var(--wood);border-radius:12px;padding:8px 12px;box-shadow:inset 0 0 14px rgba(0,0,0,.4)}
.pn{position:absolute;bottom:14px;font-size:13px;color:#5f6a73;font-weight:700}.fr .pn{right:30px}.bk .pn{left:30px}
.fit{overflow:hidden}
button,.chip{font:700 15px Nunito,sans-serif;border:0;border-radius:999px;padding:9px 18px;cursor:pointer;color:#fff;background:var(--teal)}
button:focus-visible,input:focus-visible{outline:3px solid #B85600;outline-offset:2px}
.b2{background:#B8405A}.b3{background:#B85600}.b4{background:#8CCB52;color:#1f3b10}
.ak{display:none}body.ak-on .ak{display:inline-block}
.spk{display:inline-flex;align-items:center;gap:7px}
.spk.playing{outline:3px solid var(--yel);outline-offset:2px}
.say-st{font-size:13px;color:#B52A2A;font-weight:700}
mark{background:none;color:#B33C0A;font-weight:800}
.sp{display:inline-block;border-radius:6px;padding:0 7px;font-weight:800;font-size:.85em;margin-right:5px}
.part{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px 14px;margin-bottom:9px;border:2px solid #F3E6C4}
.num{position:relative;flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 17px Fredoka;color:var(--ink)}
.row.done .num::after,.trk.done .num::after{content:"✓";position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:#17753f;color:#fff;font:700 13px Nunito;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.part p{margin:0 0 4px;line-height:1.38}
.end{background:#FFF3C4;border:2px solid #F7C873;border-radius:16px;padding:10px 14px;line-height:1.38;font-weight:700}
.panel{border:4px solid #3b3b3b;border-radius:10px;overflow:hidden;position:relative;margin-bottom:14px;background:#fff}
.panel b{position:absolute;left:0;top:0;background:#3b3b3b;color:#fff;padding:1px 10px;border-radius:0 0 10px 0;font:700 15px Fredoka;z-index:2}
.panel svg{display:block;width:100%;height:180px}
.wsc svg{display:block;width:100%;height:185px}
.isc svg{display:block;width:100%;height:160px}
.big svg{display:block;width:100%;height:270px}
.q{margin-bottom:12px}.q>div{font-weight:800;margin-bottom:5px;line-height:1.3}
.q label{display:flex;gap:8px;align-items:flex-start;padding:4px 8px;border-radius:10px;cursor:pointer;line-height:1.3}
.q input{accent-color:var(--teal);width:18px;height:18px;margin-top:1px}
.q label.ok{background:#CFF0C9}.q label.no{background:#FAD2D2}
.card{border-radius:20px;padding:16px;cursor:pointer;height:100%}
.row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.row .num{flex-shrink:0}
.prog{margin:12px 0;text-align:center}
.pbar{height:14px;border-radius:99px;background:#E7E0CC;overflow:hidden;border:2px solid #d3c9a8}
.pfill{display:block;height:100%;width:0;background:#17753f;transition:width .4s}
.ptxt{font-weight:800;font-size:14px;margin-top:4px;color:#34404A}
.akopen{display:none}body.ak-on .akopen{display:block}body.ak-on .aklock{display:none}
.st{font-weight:800;font-size:14px;min-width:96px}
#bar{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--chrome);width:100%}
#bar button.l{position:relative;background:var(--c,#fff);color:#34404A;border:2px solid #fff;padding:5px 0;width:34px;opacity:.75}
#bar button.l.on{opacity:1;border-color:var(--ortxt);box-shadow:0 0 0 2px var(--ortxt);transform:scale(1.12)}
#bar button.l.dn::after{content:"✓";position:absolute;right:-6px;top:-7px;width:16px;height:16px;border-radius:50%;background:#17753f;color:#fff;font:700 10px/12px Nunito,sans-serif;border:2px solid var(--chrome);box-sizing:border-box}
#bar .t{color:var(--chromeink);font-weight:800;min-width:92px;text-align:center}
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,20px);background:#2F6B5A;color:#fff;border-radius:16px;padding:12px 18px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:.35s;z-index:5000;display:flex;gap:12px;align-items:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media (prefers-reduced-motion:reduce){.leaf,#book,#toast,.pfill{transition-duration:.01s}}
/* Printing: one 6 x 9 in page per sheet */
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 html,body{height:auto;overflow:visible;background:#fff;display:block}
 #bar,.zone,#toast{display:none!important}
 #stage{position:static;overflow:visible}
 #scaler{position:static;width:6in;height:auto;transform:none!important}
 #book{position:static;transform:none!important;perspective:none}
 .leaf{position:static;width:6in;height:auto;transform:none!important;transform-style:flat}
 .side,.side.bk,.side.fr{position:relative;display:block;width:6in;height:9in;transform:none!important;backface-visibility:visible;border-radius:0;box-shadow:none;break-after:page;page-break-after:always}
 .side.empty{display:none}
}
/* one progress language everywhere: green ✓ = done, orange = you are here, hollow = coming up */
.trk{position:absolute;top:7px;left:48px;right:48px;height:32px;display:flex;align-items:center;gap:6px;z-index:3}
.trk .num{width:30px;height:30px;flex:0 0 30px;font-size:17px;margin-right:2px}
.sg{display:flex;align-items:center;gap:5px;font:600 12.5px Fredoka,sans-serif;color:#5f6a73;padding:2px 9px 2px 2px;border-radius:99px;border:2px solid transparent;white-space:nowrap}
.sg i,.mk{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid #b9b3a0;color:#5f6a73;font:700 12px Fredoka,sans-serif;font-style:normal;box-sizing:border-box}
.sg.on{color:#8a3f00;font-weight:700;background:#FFF3D6;border-color:var(--ortxt)}
.sg.on i,.mk.on{background:var(--ortxt);border-color:var(--ortxt);color:#fff}
.sg.dn,.sg.qd{color:#17753f}
.sg.dn i,.sg.qd i,.mk.dn{background:#17753f;border-color:#17753f;color:#fff;font-size:0}
.sg.dn i::before,.sg.qd i::before,.mk.dn::before{content:"✓";font-size:13px}
.mk{vertical-align:middle;margin:0 3px 0 8px}
.ln{flex:1;min-width:8px;height:0;border-top:3px dotted #c9b48a}.ln.dn{border-top:3px solid #17753f}
.pseg{display:flex;gap:6px}
.pseg i{flex:1;height:26px;border-radius:99px;background:#E7E0CC;border:2px solid #d3c9a8;font:700 14px/22px Fredoka,sans-serif;font-style:normal;color:#5f6a73;text-align:center}
.pseg i.done{background:#17753f;border-color:#17753f;color:#fff}.pseg i.done::before{content:"✓ "}
.q label.ok::after{content:"✓";margin-left:auto;font-weight:800;color:#17753f}
.q label.no::after{content:"✕";margin-left:auto;font-weight:800;color:#B52A2A}
.panel b{padding:2px 12px;color:#34404A}
.tq textarea{display:block;width:100%;font:600 16px/1.35 Nunito,sans-serif;color:#34404A;border:3px solid var(--teal);border-radius:12px;padding:8px 10px;resize:none;background:#fff}
.tq textarea:focus-visible{outline:3px solid #B85600;outline-offset:2px}
.tck{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px;font-weight:800}
.tck .tc{display:inline-flex;align-items:center}
.tck .mk{margin:0 4px 0 0;width:18px;height:18px;flex-basis:18px}

.q .pk svg{display:block;width:100%;height:78px;border-radius:8px}
.q select{font:700 15px Nunito,sans-serif;border:3px solid var(--teal);border-radius:10px;padding:5px 8px;background:#fff;color:#34404A}
/* confetti */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-24px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite}
.confetti i.o{width:10px;height:10px;border-radius:50%}
@keyframes fall{0%{transform:translate(0,-24px) rotate(0)}100%{transform:translate(var(--dx),900px) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
@media print{.confetti{display:none}}
/* fun intro */
.isc .burst{position:absolute;left:10px;top:8px;background:#F27C93;color:#fff;font:700 20px Fredoka,sans-serif;padding:5px 14px;border-radius:999px;transform:rotate(-6deg);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.bubble{position:relative;background:#FFE9A8;border:3px solid #F7C873;border-radius:22px;padding:12px 16px;margin:0 0 18px;font:600 1.2em/1.3 Fredoka,sans-serif;color:#34404A}
.bubble::after{content:"";position:absolute;left:46px;bottom:-14px;border:10px solid transparent;border-top-color:#F7C873;border-bottom:0}
.blocks{display:flex;justify-content:space-between;margin:6px 4px 14px}
.blk{text-align:center;width:84px}
.blk>div{width:50px;height:50px;margin:0 auto;border-radius:12px;border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.2);font:700 30px/44px Fredoka,sans-serif;color:#34404A;transform:rotate(var(--r));animation:hop 2.2s ease-in-out var(--d) infinite}
.blk span{display:block;font-weight:800;font-size:.68em;margin-top:6px;color:#34404A}
.go{background:linear-gradient(90deg,#187A6F,#2FB3A3);color:#fff;border-radius:18px;padding:11px 16px;text-align:center;font:600 1.1em/1.3 Fredoka,sans-serif;box-shadow:0 3px 0 #0f5249}
@keyframes hop{0%,70%,100%{transform:rotate(var(--r)) translateY(0)}35%{transform:rotate(var(--r)) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.blk>div{animation:none}}
@media print{.blk>div{animation:none}}
</style></head><body>

<script>
const D={"CREATORS": ["Concepcion, Abigail, Mendoza", "De Leon, Jeon, Cruz", "Dorognan, Joshael, Javier", "Erolin, Amiel, Beronio", "Fanugao, Demberly, Bulanhigan", "Gallardo, Aubrylle Dell, Esmero", "Laurio, Marleu, Chavez", "Manlabao, Dranreve Kyle, Luarez", "Penis, Jenalyn, Buhia", "Relox, Dinlene, Pastelero"], "INTRO": ["Words are more than letters and definitions. They can tell stories, express experiences, and help us understand the world around us.", "Welcome to our Storybook Dictionary! Meet five words from K to O through the story of Miguel, a student who dreams of becoming a teacher. Follow his journey, enjoy the pictures, and try the activities to learn each word.", "So, turn the pages, follow the path, and discover how every word has a story to tell!"], "GUIDE": [["1. Meet the Word", "Get to know the featured word through its pronunciation, part of speech, and simple definition."], ["2. Meet the Characters", "Discover the characters who bring each story to life and help readers understand the featured word."], ["3. Tell the Story", "Follow the story through three connected parts, presented using comic panels, narration, and character dialogues."], ["4. Vocabulary Activity", "Test your understanding and apply what you have learned through short activities."]], "LETTERS": ["k", "l", "m", "n", "o"], "WORDS": {"k": {"letter": "K", "word": "Kindle", "pron": "/ˈkin.dəl/", "pos": "Verb", "defn": "To start a feeling, interest, or idea and help it grow, like lighting a small spark.", "rx": "(kindl\\w*)", "color": "#F29CB0", "ex": ["The science fair kindled Ana’s interest in robots.", "A good book can kindle a love for reading."]}, "l": {"letter": "L", "word": "Labyrinth", "pron": "/ˈlab.ə.rɪnθ/", "pos": "Noun", "defn": "A maze: a place with so many twisting paths that it is hard to find the way out. It can also mean a confusing situation with many choices.", "rx": "(labyrinth\\w*)", "color": "#A6D96A", "ex": ["I got lost in the labyrinth of hallways on my first day.", "The garden maze was a labyrinth of tall green walls."]}, "m": {"letter": "M", "word": "Malleable", "pron": "/ˈmæl.i.ə.bəl/", "pos": "Adjective", "defn": "Easy to shape or change without breaking, like clay. A plan or a person can be malleable too, by adjusting when things change.", "rx": "(malleable\\w*)", "color": "#FFD25A", "ex": ["Clay is malleable, so we can shape it into a bowl.", "Our group plan was malleable, so we changed it when it rained."]}, "n": {"letter": "N", "word": "Navigate", "pron": "/ˈnæv.ɪ.ɡeɪt/", "pos": "Verb", "defn": "To find your way through a place, a problem, or a hard situation.", "rx": "(navigat\\w*)", "color": "#7FC8F8", "ex": ["We used a map to navigate the crowded market.", "She learned to navigate her first week at a new school."]}, "o": {"letter": "O", "word": "Outlook", "pron": "/ˈaʊt.lʊk/", "pos": "Noun", "defn": "The way you think about a situation or the future, such as hopeful or worried.", "rx": "(outlook\\w*)", "color": "#C9B6F2", "ex": ["Mia has a positive outlook, even after losing the game.", "The weather outlook for tomorrow is sunny."]}}, "CHARS": {"k": [["Miguel", "<b>The Dreamer</b><br>A student whose teacher’s lessons kindled his wish to become a teacher, too."], ["Lakas", "<b>The Encourager</b><br>This brave schoolbag cheers Miguel on and helps keep his dream kindled when things get hard."], ["Dunong", "<b>The Thinker</b><br>This clever notebook helps Miguel find real ways to keep his dream burning, one idea at a time."]], "l": [["Miguel", "<b>The Dreamer</b><br>He feels lost in a labyrinth of university choices, costs, and requirements."], ["Lakas", "<b>The Encourager</b><br>Miguel’s loyal schoolbag reminds him that even in a labyrinth, there is always a way forward."], ["Dunong", "<b>The Thinker</b><br>Miguel’s clever notebook helps him look at one path at a time, so the labyrinth feels less scary."]], "m": [["Miguel", "<b>The Dreamer</b><br>He learns that his plan can be malleable, changing shape like clay, while his dream stays the same."], ["Lakas", "<b>The Encourager</b><br>He encourages Miguel to stay brave when the first plan does not work out."], ["Dunong", "<b>The Thinker</b><br>He compares plans to clay: they can be reshaped without breaking. He also helps Miguel compare other schools."]], "n": [["Miguel", "<b>The Dreamer</b><br>He asks questions and gathers information to navigate his way toward college."], ["Lakas", "<b>The Encourager</b><br>He reminds Miguel that asking for help is a brave way to navigate a hard situation."], ["Dunong", "<b>The Thinker</b><br>He guides Miguel in comparing courses, requirements, and costs to find the best route."]], "o": [["Miguel", "<b>The Dreamer</b><br>After exploring his options, he has a more hopeful outlook and a clearer view of his next steps."], ["Lakas", "<b>The Encourager</b><br>He keeps Miguel’s outlook bright by reminding him that small steps lead closer to the dream."], ["Dunong", "<b>The Thinker</b><br>He helps Miguel see that learning from experience and from other views leads to wiser decisions."]]}, "STORY": {"k": ["The Dream We Kindle", [[["n", "Miguel always admired how his teacher’s lessons kindled curiosity in the whole class. He imagined himself standing in front of a classroom someday, helping students discover new things."], ["d", "Miguel", "“I want to become a teacher, too!”"], ["d", "Lakas", "“It sounds like your teacher kindled a dream in you!”"]], [["n", "One evening, Miguel overheard his mother discussing their household expenses. He began worrying about the costs of college, especially tuition, transportation, and school supplies."], ["d", "Miguel", "“What if we cannot afford my education, Ma?”"], ["d", "Mother", "“We have to consider our needs carefully, anak. But I also want you to have a chance to study.”"], ["d", "Dunong", "“Maybe we can explore the opportunities available to students before giving up.”"]], [["n", "Miguel realized that although his family’s financial situation was difficult, he did not have to abandon his dream immediately. He decided to learn about possible ways to continue his education."], ["d", "Miguel", "“I may not know how yet, but this feeling won’t fade. I’ll keep it kindled and start looking for a way.”"]]], "With renewed hope, Miguel’s dream of becoming a teacher was finally kindled. He knew that the journey would not be easy, but he was ready to take his first step."], "l": ["The Labyrinth of Choices", [[["n", "Miguel began searching for universities that offered an education program. He was excited to discover several schools, but most of the universities he liked were far from home."], ["d", "Miguel", "“This university offers the program I want! But it’s so far away.”"], ["d", "Lakas", "“That’s exciting! Maybe this is where your journey will take you.”"]], [["n", "As Miguel explored his options, he discovered that studying far from home meant more than paying tuition. He also had to consider transportation, accommodation, food, and other daily expenses. Every option seemed to lead to another problem."], ["d", "Miguel", "“If I choose this university, where will I stay? How will I afford my daily expenses?”"], ["d", "Dunong", "“It seems like you’re walking through a labyrinth of choices, Miguel. Every path has something you need to consider.”"], ["d", "Miguel", "“I thought finding a university would be simple. Now I feel lost in this labyrinth, and I don’t even know which direction to take.”"]], [["n", "Miguel stared at the list of universities on his notebook. It felt like a labyrinth of its own. He realized that choosing a school was not only about finding one that offered his dream course. He also needed to consider his family’s financial situation and what they could realistically manage."], ["d", "Lakas", "“You don’t have to choose everything today. Take your time.”"], ["d", "Dunong", "“Let’s examine your options one by one. There might be a path that works for you.”"]]], "Miguel still had many questions, but he was ready to explore his options one step at a time. Though the road ahead remained confusing, he was determined to find his way through the labyrinth of choices."], "m": ["A Malleable Dream", [[["n", "After listing his university options, Miguel realized that his first choice might be difficult for his family to afford. He felt disappointed because he had already imagined himself studying there."], ["d", "Miguel", "“I really wanted to study at that university. Does this mean I have to give up on my dream?”"], ["d", "Lakas", "“Not necessarily, Miguel. Maybe there’s another way to reach it.”"]], [["n", "Dunong opened Miguel’s notebook and helped him compare nearby universities. They looked into tuition fees, available programs, transportation costs, and possible scholarships. Miguel began to realize that he could consider other schools without changing his dream of becoming a teacher."], ["d", "Dunong", "“Think of your plan like clay, Miguel. It’s malleable, so you can reshape it as you discover new possibilities, and it’s still the same dream.”"], ["d", "Miguel", "“So, I can adjust my plans while keeping the same goal?”"], ["d", "Dunong", "“Exactly! A malleable plan bends to fit new circumstances, but it never breaks.”"]], [["n", "Miguel decided to keep his plan malleable and include more affordable universities in his list. Although his original plan had changed, he felt more hopeful because he had discovered other ways to pursue his chosen course."], ["d", "Lakas", "“See? Changing your path doesn’t mean losing your direction!”"]]], "Miguel learned that, like something malleable that can be shaped into different forms, his plans could change to meet life’s challenges without losing sight of the dream he wanted to achieve."], "n": ["Learning to Navigate the Way Forward", [[["n", "With his list of universities revised, Miguel decided to ask for help in navigating his options. He visited the school guidance office to learn about scholarships, financial assistance, and other o const leaves=[...book.querySelectorAll('.leaf')];
function paint(){leaves.forEach((l,j)=>{l.classList.toggle('f',j<cur);if(!l.dataset.busy)l.style.zIndex=j<cur?j+1:N-j});
 book.style.transform=cur==0?'translateX(-288px)':cur==N?'translateX(288px)':'none';
 const pgs=[2*cur-1,2*cur],cl=L.find(l=>pgs.some(p=>p>=KEY['word_'+l]&&p<=KEY['result_'+l]));
 document.querySelectorAll('#chips button').forEach(b=>{const on=b.dataset.go=='word_'+cl;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')});
 document.getElementById('ind').textContent=cur==0?'Cover':cur==N?'Back cover':(cl?W[cl].letter+' · ':'')+'Pages '+(2*cur-1)+'–'+(2*cur);
 document.getElementById('pv').style.visibility=cur?'visible':'hidden';document.getElementById('nx').style.visibility=cur<N?'visible':'hidden'}
function turn(d){const j=d>0?cur:cur-1;if(j<0||j>=N)return;const l=leaves[j];l.dataset.busy=1;l.style.zIndex=N+2;cur+=d;paint();setTimeout(()=>{delete l.dataset.busy;l.style.zIndex=j<cur?j+1:N-j},950)}
let busy=0;function go(n){n=Math.max(0,Math.min(N,n));if(n==cur||busy)return;busy=1;const d=n>cur?1:-1;(function s(){if(cur==n){busy=0;return}turn(d);setTimeout(s,Math.abs(n-cur)>0?170:0)})()}
const spread=k=>{const s=KEY[k];return s%2?(s+1)/2:s/2};const goKey=k=>go(spread(k));
document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nx').onclick=()=>go(cur+1);document.getElementById('toc').onclick=()=>goKey('contents');
document.getElementById('zl').onclick=()=>go(cur-1);document.getElementById('zr').onclick=()=>go(cur+1);
document.getElementById('chips').innerHTML=L.map(l=>`<button class="l" data-go="word_${l}" style="--c:${col[l]};margin:0 2px;border-radius:50%" aria-label="${W[l].letter} for ${W[l].word}" title="${W[l].letter} for ${W[l].word}">${W[l].letter}</button>`).join('');
document.addEventListener('keydown',e=>{if(e.target.closest('textarea,input'))return;if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
document.addEventListener('input',e=>{if(e.target.matches('.tq textarea'))tyUp(e.target)});
let sx=null;document.getElementById('stage').addEventListener('pointerdown',e=>{sx=e.clientX});document.getElementById('stage').addEventListener('pointerup',e=>{if(sx!=null&&Math.abs(e.clientX-sx)>90&&!e.target.closest('input,button,textarea'))go(cur+(e.clientX<sx?1:-1));sx=null});
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)goKey(g.dataset.go);
 const c=e.target.closest('[data-chk]');if(c)check(c.dataset.chk);const r=e.target.closest('[data-rst]');if(r)reset(r.dataset.rst);
 const s=e.target.closest('[data-say]');if(s)say(s)});
/* ---------- pronunciation sound ---------- */
let voices=[];const hasTTS='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!='undefined';
if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
const pick=()=>voices.find(v=>/^en[-_]US/i.test(v.lang)&&/google|samantha|zira|aria|jenny|female/i.test(v.name))||voices.find(v=>/^en[-_]US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;
function say(btn){const st=btn.closest('.side').querySelector('.say-st');
 if(!hasTTS){st.textContent='Sorry, this browser cannot play sound. Try Chrome, Edge, Safari or Firefox.';return}
 st.textContent='';const u=new SpeechSynthesisUtterance(btn.dataset.say);u.lang='en-US';const v=pick();if(v){u.voice=v;u.lang=v.lang}
 u.rate=btn.dataset.slow?0.5:0.85;
 u.onstart=()=>btn.classList.add('playing');u.onend=u.onerror=()=>btn.classList.remove('playing');
 speechSynthesis.cancel();speechSynthesis.speak(u)}
/* ---------- quizzes + Answer Key unlock ---------- */
const done={};
function toast(){const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),9000)}
function sync(){const n=Object.keys(done).length;
 document.querySelectorAll('.pseg i').forEach(e=>e.classList.toggle('done',!!done[e.dataset.seg]));
 document.querySelectorAll('.ptxt').forEach(e=>e.textContent=n+' of '+L.length+' quizzes done');
 L.forEach(l=>{document.querySelectorAll(`[data-q="${l}"]`).forEach(e=>e.classList.toggle('qd',!!done[l]));document.querySelectorAll(`#chips [data-go="word_${l}"]`).forEach(e=>e.classList.toggle('dn',!!done[l]));document.querySelectorAll(`[data-row="${l}"]`).forEach(e=>e.classList.toggle('done',!!done[l]));document.querySelectorAll(`[data-st="${l}"]`).forEach(e=>e.textContent=done[l]?'✓ Done':'Not done yet')});
 const all=n==L.length,was=document.body.classList.contains('ak-on');document.body.classList.toggle('ak-on',all);if(all&&!was)toast()}
function check(l){const qs=D.QUIZ[l][1],reveal=false;let sc=0,ans=0,out='';
 qs.forEach((q,n)=>{if(n==2){const ta=document.getElementById('tx_'+l),has=ta.value.trim()!='',r=tyChk(l,ta.value),ok=r.w&&r.n&&r.p;if(has)ans++;if(ok)sc++;const miss=[!r.w&&'use the word '+W[l].word.toLowerCase(),!r.n&&'write at least 5 words',!r.p&&'end with . ! or ?'].filter(Boolean).join(', ');out+=`<p>${n+1}. ${!has?'<b style="color:#5f6a73">○ No answer yet</b> – type your sentence':ok?'<b style="color:#17753f">✓ Correct!</b> Great sentence!':'<b style="color:#B52A2A">✕ Not quite</b> – '+miss}</p>`;return}
  if(q[3]=='match'){const ss=q[2].split('').map((a,i)=>document.getElementById('m_'+l+n+'_'+i));const has=ss.every(x=>x.value),ok=has&&ss.every((x,i)=>x.value==q[2][i]);if(has)ans++;if(ok)sc++;ss.forEach((x,i)=>{x.style.borderColor=!x.value?'':(x.value==q[2][i]?'#17753f':'#B52A2A')});out+=`<p>${n+1}. ${!has?'<b style="color:#5f6a73">○ No answer yet</b> – match all three':ok?'<b style="color:#17753f">✓ Correct!</b>':'<b style="color:#B52A2A">✕ Not quite</b> – '+(reveal?'the answers are '+q[2].split('').join(', '):'try again!')}</p>`;return}
  const sel=book.querySelector(`input[name="${l}${n}"]:checked`);
  book.querySelectorAll(`input[name="${l}${n}"]`).forEach(i=>{const lb=i.closest('label');lb.classList.remove('ok','no');if(i.checked)lb.classList.add(i.value==q[2]?'ok':'no');else if(reveal&&i.value==q[2])lb.classList.add('ok')});
  const ok=!!sel&&sel.value==q[2];if(sel)ans++;if(ok)sc++;
  out+=`<p>${n+1}. ${!sel?'<b style="color:#5f6a73">○ No answer yet</b> – choose one':ok?'<b style="color:#17753f">✓ Correct!</b>':'<b style="color:#B52A2A">✕ Not quite</b> – '+(reveal?'the answer is '+q[2]:'try again!')}</p>`});
 const full=ans==qs.length;if(full&&(!REQUIRE_PERFECT||sc==qs.length))done[l]=true;
 document.getElementById('res_'+l).innerHTML=`<p style="font:700 44px Fredoka;color:var(--ortxt);margin:6px">${sc} / ${qs.length}</p><p style="font-weight:800">${!full?'Answer all '+qs.length+' questions to finish this quiz.':sc==qs.length?'Great job, Explorer!':'Quiz complete! Review the ones you missed and try again.'}</p>${out}<button data-go="quiz_${l}" style="margin:4px">See the quiz</button>`;
 sync();if(spread('result_'+l)!=cur)go(spread('result_'+l))}
function reset(l){book.querySelectorAll(`select[id^="m_${l}"]`).forEach(x=>{x.value='';x.style.borderColor=''});const tx=document.getElementById('tx_'+l);if(tx){tx.value='';tyUp(tx)}book.querySelectorAll(`input[name^="${l}"]`).forEach(i=>{i.checked=false;i.closest('label').classList.remove('ok','no')});document.getElementById('res_'+l).innerHTML='<p>Answer the three questions on the left page, then press <b>Check my answers</b>.</p>'}
function fit(){document.querySelectorAll('.fit').forEach(el=>{let s=+el.dataset.max;el.style.fontSize=s+'px';while(el.scrollHeight>el.clientHeight+1&&s>10){s-=.5;el.style.fontSize=s+'px'}})}
function scale(){const k=Math.min(innerWidth/1212,(document.getElementById('stage').clientHeight)/904);document.getElementById('scaler').style.transform=`translate(-50%,-50%) scale(${k})`}
addEventListener('resize',scale);scale();paint();sync();(document.fonts?document.fonts.ready:Promise.resolve()).then(fit);fit();
</script></body></html>
